name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,dev]"
      - run: ruff check .
      - run: mypy src
      - run: bandit -q -r src
      - run: pytest tests -q -m "not real_grist" --cov=grist_provisioner --cov-branch --cov-fail-under=100
